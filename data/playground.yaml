# Things other people can reuse: templates, reading lists, slides, advice.
resources:
  - name: "This website"
    desc: "Source of this homepage — a YAML + Jinja static site with publication filters and a playground page. Fork it and edit the data/ folder to make your own."
    tags: ["Template", "Python", "GitHub Pages"]
    links: { GitHub: "https://github.com/LzyFischer/LzyFischer.github.io" }

# Writing elsewhere (Zhihu, Medium, Substack, ...), newest first.
