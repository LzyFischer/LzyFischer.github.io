# Everything on playground.html.
# Empty sections are hidden automatically.

# Software, tools and GitHub projects.
#   name, desc     (required)
#   tags           short labels, e.g. ["Python", "LLM"]
#   links          { GitHub: url, Demo: url, ... }
# Tip: a static web app in its own repo can be served for free at
# https://lzyfischer.github.io/<repo>/ by turning on GitHub Pages for that repo.
projects:
  - name: "MoCo: Model Collaboration"
    desc: "A one-stop shop for model collaboration research — methods, benchmarks and tooling for making multiple language models work together."
    tags: ["Python", "LLM"]
    links: { GitHub: "https://github.com/BunsenFeng/model_collaboration", Paper: "https://arxiv.org/abs/2601.21257" }

  - name: "PyGDebias"
    desc: "Open-source library for fairness-aware graph learning: 13 debiasing methods, 26 graph datasets, and benchmarks under common fairness notions."
    tags: ["Python", "Graph learning", "Fairness"]
    links: { GitHub: "https://github.com/yushundong/PyGDebias" }

