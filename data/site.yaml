# Quick-chat message box on the homepage (first screen on desktop).
contact:
  chat_title: "Hi, I'm Zhenyu 👋"
  chat_status: "Open to chats, collabs & internships"
  chat_text: "No need for a formal email. Ask me anything, pitch an idea, or just say hi. Anonymous is fine, and no question is too small."
  chat_placeholder: "Type a quick note…"
  chat_fine: "Goes straight to my inbox. Leave an email if you'd like a reply."
  # Buttons that pre-fill the box with a first sentence.
  starters:
    - { label: "💡 Collab idea", text: "Hi Zhenyu, I have an idea we might work on together: " }
    - { label: "📄 About a paper", text: "Hi Zhenyu, I have a question about your paper " }
    - { label: "💼 Internship / hiring", text: "Hi Zhenyu, I'm reaching out about an internship / position: " }
    - { label: "☕ Just saying hi", text: "Hi Zhenyu! Just wanted to say hi, " }
  # FormSubmit forwards each message to this inbox (free, no account).
  # The first message triggers a confirmation email from FormSubmit; click it once to activate.
  form_action: "https://formsubmit.co/ajax/vjd5zr@virginia.edu"

# Paragraphs of the About section. HTML is allowed.
about:
  - >
    I am a Ph.D. student in Electrical and Computer Engineering at the
    <a href="https://www.virginia.edu/">University of Virginia</a>, advised by
    Prof. <a href="https://jundongli.github.io/">Jundong Li</a>, and a <b>Capital One PhD Fellow</b>.
    Before that, I received my B.S. in Physics from Xi'an Jiaotong University, where I was lucky to join the LUD Lab.
    I have also interned at AT&amp;T as an Applied Scientist.
  - >
    I am interested in LLM agents, memory, recursive self-improvement (RSI), and distillation,
    as well as graph and time series learning.
    <b>I am open to collaborations and discussions — feel free to reach out by email or the <a href="#say-hi">message box</a>!</b>
    <b>Actively looking for research internships!</b>

