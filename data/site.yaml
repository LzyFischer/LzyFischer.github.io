# Paragraphs of the About section. HTML is allowed.
about:
  - >
    I am a Ph.D. student in Electrical and Computer Engineering at the
    <a href="https://www.virginia.edu/">University of Virginia</a>, advised by
    Prof. <a href="https://jundongli.github.io/">Jundong Li</a>. Before that, I received my
    B.S. in Physics from Xi'an Jiaotong University, where I was lucky to join the LUD Lab.
    I have also interned at AT&amp;T as an Applied Scientist.
  - >
    My research centers on <i>LLM reasoning</i>, <i>memory</i>, and <i>distillation</i> —
    how models reason, remember, and compress what they know — with
    <i>brain-disorder prediction</i> and <i>AI for science</i> as secondary interests.
    <b>I am open to collaborations and discussions — feel free to reach out via email!</b>

